name: Build ChinaMax_Clean

on:
  schedule:
    - cron: "30 20 * * *"   # 每天北京时间 04:30
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_chinamax.py"
      - "scripts/chinamax_exclude.txt"
      - "scripts/stun_extra.txt"
      - "Quantumult/MultiRules.list"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_chinamax.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Quantumult/ChinaMax_Clean.list Quantumult/STUN.list
          git diff --cached --quiet || git commit -m "chore: rebuild ChinaMax_Clean"
          git push
