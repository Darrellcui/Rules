name: Build Rule Lists

on:
  schedule:
    - cron: "30 20 * * *"   # 每天北京时间 04:30
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "Quantumult/MultiRules.list"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Meta.list 必须先生成，ChinaMax 清洗会把它作为受保护列表
      - run: python scripts/build_meta.py
      - run: python scripts/build_chinamax.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Quantumult/Meta.list Quantumult/ChinaMax_Clean.list Quantumult/STUN.list
          git diff --cached --quiet || git commit -m "chore: rebuild rule lists"
          git push
